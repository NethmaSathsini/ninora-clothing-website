
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Ninora Clothing</title>

    <link rel="stylesheet" href="/ninora/style.css?v=18">
</head>
<body>

    <!-- Admin Login Page -->
    <main class="admin-login-container">

        <section class="admin-login-card">

            <!-- Brand Name -->
            <div class="admin-login-header">
                <h1>NINORA</h1>
                <h2>Admin Login</h2>
                <p>Sign in to manage the Ninora Clothing website.</p>
            </div>

            <!-- Admin Login Form -->
            <form id="adminLoginForm">

                <div class="admin-form-group">
                    <label for="adminEmail">Email Address</label>
                    <input
                        type="email"
                        id="adminEmail"
                        name="adminEmail"
                        placeholder="Enter admin email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="admin-form-group">
                    <label for="adminPassword">Password</label>
                    <input
                        type="password"
                        id="adminPassword"
                        name="adminPassword"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="admin-login-btn">
                    Login to Dashboard
                </button>

            </form>

            <!-- Back to Website -->
            <div class="admin-login-footer">
                <a href="index.html">
                    &larr; Back to Website
                </a>
            </div>

        </section>

    </main>

    <script src="/ninora/script.js?v=8"></script>

</body>
</html>
