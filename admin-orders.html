
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Orders | Ninora Clothing</title>

    <link rel="stylesheet" href="/ninora/style.css?v=19">
</head>
<body>

    <div class="admin-dashboard-layout">

        <!-- Admin Sidebar -->
        <aside class="admin-sidebar">

            <div class="admin-sidebar-logo">
                <h2>NINORA</h2>
                <p>Admin Panel</p>
            </div>

            <nav class="admin-sidebar-nav">

                <a href="admin-dashboard.html">
                    Dashboard
                </a>

                <a href="admin-products.html">
                    Manage Products
                </a>

                <a href="admin-orders.html" class="active">
                    Manage Orders
                </a>

                <a href="admin-customers.html">
                    Customer Details
                </a>

            </nav>

            <div class="admin-sidebar-footer">
                <a href="index.html">Back to Website</a>
            </div>

        </aside>

        <!-- Main Content -->
        <main class="admin-dashboard-main">

            <!-- Page Header -->
            <header class="admin-orders-header">
                <h1>Manage Orders</h1>
                <p>View customer orders and update order status.</p>
            </header>

            <!-- Orders Section -->
            <section class="admin-orders-section">

                <h2>Customer Orders</h2>

                <div class="admin-orders-table-wrapper">

                    <table class="admin-orders-table">

                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Date</th>
                                <th>Total (LKR)</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="adminOrdersTableBody">
                            <tr>
                                <td colspan="7">
                                    Orders will appear here.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </section>

            <!-- Order Details Section -->
            <section
                class="admin-order-details-section"
                id="adminOrderDetailsSection"
                hidden
            >

                <div class="admin-order-details-header">
                    <h2>Order Details</h2>

                    <button
                        type="button"
                        id="closeOrderDetailsBtn"
                    >
                        Close
                    </button>
                </div>

                <div id="adminOrderDetailsContent">
                    <!-- Selected order details appear here -->
                </div>

            </section>

        </main>

    </div>

    <script src="/ninora/script.js?v=11"></script>

</body>
</html>
