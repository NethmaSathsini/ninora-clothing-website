
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products | Ninora Clothing</title>

    <link rel="stylesheet" href="/ninora/style.css?v=19">
</head>
<body>

    <div class="admin-dashboard-layout">

        <!-- Sidebar -->
        <aside class="admin-sidebar">

            <div class="admin-sidebar-logo">
                <h2>NINORA</h2>
                <p>Admin Panel</p>
            </div>

            <nav class="admin-sidebar-nav">

                <a href="admin-dashboard.html">
                    Dashboard
                </a>

                <a href="admin-products.html" class="active">
                    Manage Products
                </a>

                <a href="admin-orders.html">
                    Manage Orders
                </a>

                <a href="admin-customers.html">
                    Customer Details
                </a>

            </nav>

            <div class="admin-sidebar-footer">
                <a href="index.html">Back to Website</a>
            </div>

        </aside>

        <!-- Main Content -->
        <main class="admin-dashboard-main">

            <header class="admin-products-header">

                <div>
                    <h1>Manage Products</h1>
                    <p>Add, edit, and remove clothing products.</p>
                </div>

                <button type="button" id="addProductBtn">
                    + Add New Product
                </button>

            </header>

            <!-- Product Form -->
            <section class="admin-product-form-section" id="productFormSection" hidden>

                <h2 id="productFormTitle">Add New Product</h2>

                <form id="adminProductForm">

                    <input type="hidden" id="editProductId">

                    <div class="admin-product-form-grid">

                        <div class="admin-form-group">
                            <label for="productName">Product Name</label>
                            <input type="text" id="productName" required>
                        </div>

                        <div class="admin-form-group">
                            <label for="productPrice">Price (LKR)</label>
                            <input type="number" id="productPrice"
                                   min="0.01" step="0.01" required>
                        </div>

                        <div class="admin-form-group">
                            <label for="productCategory">Category</label>
                            <select id="productCategory" required>
                                <option value="">Select Category</option>
                                <option value="Blouses">Blouses</option>
                                <option value="Skirts">Skirts</option>
                                <option value="Trousers">Trousers</option>
                                <option value="Dresses">Dresses</option>
                                <option value="T-Shirts">T-Shirts</option>
                                <option value="Tops">Tops</option>
                            </select>
                        </div>

                        <div class="admin-form-group">
                            <label for="productImage">Image Path</label>
                            <input type="text" id="productImage"
                                   placeholder="images/product1.jpg" required>
                        </div>

                    </div>

                    <div class="admin-product-form-actions">
                        <button type="submit" class="admin-save-product-btn">
                            Save Product
                        </button>

                        <button type="button" id="cancelProductBtn"
                                class="admin-cancel-product-btn">
                            Cancel
                        </button>
                    </div>

                </form>

            </section>

            <!-- Products Table -->
            <section class="admin-products-table-section">

                <h2>Product List</h2>

                <div class="admin-products-table-wrapper">

                    <table class="admin-products-table">

                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price (LKR)</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="adminProductsTableBody">
                            <tr>
                                <td colspan="5">
                                    Products will appear here.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="/ninora/script.js?v=10"></script>

</body>
</html>
