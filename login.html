
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Ninora Clothing</title>

    <link rel="stylesheet" href="/ninora/style.css?v=29">
</head>
<body>
    
<!-- NINORA Customer Navigation Bar -->
<header class="navbar">
    <a href="index.html" class="logo">NINORA</a>

    <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="products.html">Categories</a>
        <a href="my-orders.html">My Orders</a>
        <a href="login.html">Login</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

    <main class="login-container">
        <div class="login-box">

            <h1>Welcome Back</h1>
            <p>Login to your Ninora account.</p>

            
<form id="loginForm">

    <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="form-group">
        <label for="loginPassword">Password</label>
        <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Enter your password"
            required
        >
    </div>

    <button type="submit" class="login-btn">
        Login
    </button>

    <p class="register-link">
        Don't have an account?
        <a href="register.html">Register here</a>
    </p>

</form>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
